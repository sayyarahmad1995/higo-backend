services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: higo
      POSTGRES_USER: higo
      POSTGRES_PASSWORD: local_higo_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - higo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U higo -d higo"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  higo-postgres:
